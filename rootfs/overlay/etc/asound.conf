# Vortex: the phone's only sound card, with software mixing so the shell
# and an app can play at the same time.
pcm.!default {
	type asym
	playback.pcm "vortex_out"
	capture.pcm "vortex_in"
}
ctl.!default {
	type hw
	card msm8909
}
pcm.vortex_out {
	type plug
	slave.pcm {
		type dmix
		ipc_key 6300
		ipc_perm 0666
		slave {
			pcm "hw:msm8909,0"
			rate 48000
			channels 2
			format S16_LE
		}
	}
}
pcm.vortex_in {
	type plug
	slave.pcm {
		type dsnoop
		ipc_key 6301
		ipc_perm 0666
		slave {
			pcm "hw:msm8909,1"
			rate 48000
			channels 1
			format S16_LE
		}
	}
}
