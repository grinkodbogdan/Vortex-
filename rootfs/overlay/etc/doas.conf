# Only what the shell needs as root.
permit nopass vortex as root cmd sv
permit nopass vortex as root cmd poweroff
permit nopass vortex as root cmd reboot
# Wi-Fi and Bluetooth switches (checks its own arguments)
permit nopass vortex as root cmd /usr/libexec/vortex/vortex-radio
# Calls and SMS (ModemManager; checks its own arguments)
permit nopass vortex as root cmd /usr/libexec/vortex/vortex-modem
