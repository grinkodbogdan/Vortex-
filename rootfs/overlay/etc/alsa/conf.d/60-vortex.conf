# Vortex audio devices.  /etc/asound.conf picks the default output:
# vortex-audio switches it between the phone (asound-phone.conf) and
# Bluetooth headphones (asound-bt.conf) in /usr/share/vortex.

# The phone's sound card, with software mixing so the shell and an app can
# play at the same time.
pcm.vortex_out {
	type plug
	slave.pcm {
		type dmix
		ipc_key 6300
		ipc_perm 0666
		slave {
			pcm "hw:msm8909,0"
			rate 48000
			channels 2
			format S16_LE
		}
	}
}

# The phone's microphone.
pcm.vortex_in {
	type plug
	slave.pcm {
		type dsnoop
		ipc_key 6301
		ipc_perm 0666
		slave {
			pcm "hw:msm8909,1"
			rate 48000
			channels 1
			format S16_LE
		}
	}
}

# The most recently connected Bluetooth headphones (bluez-alsa).
pcm.vortex_bt {
	type plug
	slave.pcm "bluealsa:DEV=00:00:00:00:00:00,PROFILE=a2dp"
}
