# Vortex shell configuration (read by vortex-shell and the vortex-kai-* tools)

font = /usr/share/vortex/fonts/Roboto-Regular.ttf
font_size = 15

apps_dir = /var/lib/vortex/apps
cache_dir = /var/cache/vortex

# BananaHackers store database (store-db, schema v3)
store_url = https://banana-hackers.gitlab.io/store-db/data.json

run_cmd = /usr/libexec/vortex/vortex-kai-run
install_cmd = /usr/libexec/vortex/vortex-kai-install
remove_cmd = /usr/libexec/vortex/vortex-kai-remove
call_cmd = /usr/libexec/vortex/vortex-call

keymap = /etc/vortex/keymap.conf
# sysfs backlight directory, or "auto" for the first one found
backlight = auto
# seconds of inactivity before the screen turns off (0 = never)
screen_timeout = 30
