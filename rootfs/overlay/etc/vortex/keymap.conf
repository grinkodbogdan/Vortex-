# evdev key code -> Vortex key.  Lines here override the built-in defaults
# (see shell/src/util.c).  Find codes with: evtest /dev/input/eventN
#
# Key names: up down left right ok soft_left soft_right back call end
#            0-9 star hash vol_up vol_down none
#
# Nokia 6300 4G (nokia-leo): /etc/udev/hwdb.d/61-vortex-nokia-leo.hwdb
# remaps the keypad so soft keys arrive as F1/F2, call/end as F3/F4 and
# */# as keypad * and /, which the defaults cover (and which KaiOS apps
# understand too).  Without the hwdb the shell still knows the raw codes
# (696/697 soft keys, 445/446 call/end).  Example override:
#
# 139 soft_left     # KEY_MENU (the key with the three lines)
