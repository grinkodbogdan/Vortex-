# evdev key code -> Vortex key.  Lines here override the built-in defaults
# (see shell/src/util.c).  Find codes with: evtest /dev/input/eventN
#
# Key names: up down left right ok soft_left soft_right back call end
#            0-9 star hash vol_up vol_down none
#
# Nokia 6300 4G (nokia-leo): the keypad matrix in the mainline device tree
# reports standard KEY_* codes, which the defaults already cover.  If your
# kernel maps the soft keys differently, fix them here, e.g.:
#
# 139 soft_left     # KEY_MENU
# 158 soft_right    # KEY_BACK
# 14  back          # KEY_BACKSPACE
