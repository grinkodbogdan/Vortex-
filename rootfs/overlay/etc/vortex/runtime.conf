# Sourced by vortex-kai-run (POSIX sh) before starting the web engine.

VORTEX_WEB_ENGINE=cog
VORTEX_COG_PLATFORM=drm
# WebKit starts dropping caches above this (MiB). The phone has 512 MB.
VORTEX_WEB_MEM_LIMIT=180

# The 6300 4G panel (panel-mipi-dbi) is a display-only DRM device; the
# Adreno 304 GPU is a separate device.  Until Mesa's kmsro path is wired up
# for it, render in software through kms_swrast:
# export MESA_LOADER_DRIVER_OVERRIDE=kms_swrast
# export GALLIUM_DRIVER=softpipe

VORTEX_EXTRA_ARGS=
