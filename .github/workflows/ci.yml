name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick zip unzip shellcheck
      - name: Build shell (device + headless)
        run: make -C shell all headless
      - name: Shell screenshot tests
        run: make -C shell test
      - name: Shell under ASan/UBSan
        run: |
          make -C shell clean
          make -C shell headless CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 shell/tests/run.sh
      - name: Playwright (KaiOS shim test)
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Runtime tests
        run: runtime/tests/run.sh
      - name: Shellcheck
        run: shellcheck -s sh runtime/vortex-* runtime/tests/run.sh rootfs/*.sh kernel/build.sh tools/*.sh shell/tests/*.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shell/tests/out/*.png

  cross-armv7-musl:
    runs-on: ubuntu-24.04
    container: ghcr.io/void-linux/void-musl-full:latest
    steps:
      - name: Install cross toolchain
        run: |
          xbps-install -Syu xbps || true
          xbps-install -Sy cross-armv7l-linux-musleabihf make git
      - uses: actions/checkout@v4
      - name: Build static armv7 shell
        run: |
          make -C shell CC=armv7l-linux-musleabihf-gcc LDFLAGS="-static -s"
          ls -l shell/vortex-shell
