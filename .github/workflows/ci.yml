name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick zip unzip shellcheck adb
      - name: Build shell (device + headless)
        run: make -C shell all headless
      - name: Shell screenshot tests
        run: make -C shell test
      - name: Shell under ASan/UBSan
        run: |
          make -C shell clean
          make -C shell headless CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 shell/tests/run.sh
      - name: Playwright (KaiOS shim test)
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Runtime tests
        run: runtime/tests/run.sh
      - name: adbd (real adb client over localhost TCP)
        run: make -C adbd test
      - name: Shellcheck
        run: |
          shellcheck -s sh -S warning $(grep -l '^#!/bin/sh' runtime/vortex-* runtime/tests/*.sh) \
            rootfs/*.sh kernel/build.sh tools/*.sh tools/vm/*.sh tools/phone/initramfs-init shell/tests/*.sh \
            rootfs/overlay/etc/sv/*/run rootfs/overlay/etc/sv/*/log/run rootfs/overlay/etc/runit/core-services/*.sh \
            adbd/tests/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shell/tests/out/*.png

  cross-armv7-musl:
    # Static ARM build of the shell with clang against a Void musl sysroot
    # (the same way rootfs/build.sh does it), then the screenshot tests
    # running the ARM binary under qemu-arm.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-user imagemagick adb
      - name: Void armv7 musl sysroot
        run: |
          mkdir -p xbps sysroot
          curl -fsSL https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz | tar -xJ -C xbps
          yes | sudo XBPS_ARCH=armv7l-musl xbps/usr/bin/xbps-install.static -S -U -r "$PWD/sysroot" \
            -R https://repo-default.voidlinux.org/current/musl musl-devel kernel-libc-headers gcc
      - name: Build static armv7 shell
        run: |
          CC="clang --target=armv7l-linux-musleabihf --sysroot=$PWD/sysroot -mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard"
          make -C shell CC="$CC" LDFLAGS="-fuse-ld=lld -static -s" all vortex-shell-headless
          make -C adbd CC="$CC" LDFLAGS="-fuse-ld=lld -static -s"
          file shell/vortex-shell shell/vortex-shell-headless shell/vortex-splash adbd/vortex-adbd
      - name: Screenshot tests on the ARM binary (qemu-arm)
        run: |
          cd shell
          mv vortex-shell-headless vsh-arm
          mv vortex-splash splash-arm
          printf '#!/bin/sh\nexec qemu-arm "$(dirname "$0")/vsh-arm" "$@"\n' > vortex-shell-headless
          printf '#!/bin/sh\nexec qemu-arm "$(dirname "$0")/splash-arm" "$@"\n' > vortex-splash
          chmod +x vortex-shell-headless vortex-splash
          ./tests/run.sh
      - name: adbd tests on the ARM binary (qemu-arm)
        run: |
          cd adbd
          mv vortex-adbd adbd-arm
          printf '#!/bin/sh\nexec qemu-arm "$(dirname "$0")/adbd-arm" "$@"\n' > vortex-adbd
          chmod +x vortex-adbd
          ./tests/run.sh
